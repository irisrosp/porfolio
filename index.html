<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Ros Páramo — net.art portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Marca de agua arriba a la derecha (siempre visible) -->
    <div class="watermark">
        Iris Ros Páramo | Graduada en Lengua y Literaturas Hispánicas • Máster en Estética Contemporánea
    </div>

    <!-- Contenedor del slideshow -->
    <div class="slideshow-container">
        <!-- Slide 1: imagen grande -->
        <div class="slide active" id="slide1">
            <img src="slide1imagen.png" alt="Iris Ros Páramo - Inicio Portfolio">
        </div>

        <!-- Slide 2: botones de proyectos -->
        <div class="slide" id="slide2">
            <div class="buttons-container">
                <button class="project-button" data-proyecto="teatraviesa">Sobre neurodivergencia: "TEAtraviesa"</button>
                <button class="project-button" data-proyecto="dios-coche">Sobre fetichismo de la mercancía: "¿Por qué Dios necesita un coche?"</button>
            </div>
        </div>
    </div>

    <!-- Flecha derecha (aparece a los 2 segundos) -->
    <div class="arrow right" id="nextArrow">
        &#10095;
    </div>

    <script src="script.js"></script>
</body>
</html>
